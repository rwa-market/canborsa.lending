# http context (/etc/nginx/conf.d/lending-limits.conf). Audit I-5, B-3.
# First line of limits, keyed by the real client address ($binary_remote_addr is the TCP connection address,
# a header cannot spoof it). The backend limit (@fastify/rate-limit) stays as the second line.
server_tokens off;

limit_req_zone $binary_remote_addr zone=lending_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lending_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=lending_health:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=lending_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# API request bodies are small: commands and signatures, no files
client_max_body_size 256k;

# $lending_monitor_ok: 1 if Authorization matches the monitor token. The file is written by lending-ctl
# install-monitor-token (map "Bearer <MONITOR_TOKEN>" -> 1); without a token /healthz/ready is closed.
# the map key "Bearer <64 chars>" is longer than the default bucket (64 bytes): nginx -t fails
map_hash_bucket_size 128;
include /etc/nginx/lending-monitor.conf;
