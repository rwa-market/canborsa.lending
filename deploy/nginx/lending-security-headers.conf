# Security headers (audit I-4, F-2). Included in server and in every location
# that has its own add_header: add_header in a location cancels inheritance from the server level.
# $lending_csp and $lending_csp_report_only are set by /etc/nginx/lending-csp.conf (written by lending-ctl switch:
# hashes of the inline scripts in index.html and extra CSP_* sources). An empty value does not send the header.
# $lending_hsts: non-empty only in the TLS server.
add_header Content-Security-Policy $lending_csp always;
add_header Content-Security-Policy-Report-Only $lending_csp_report_only always;
add_header Strict-Transport-Security $lending_hsts always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Wallet windows open as popups and talk through opener: same-origin-allow-popups
add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
