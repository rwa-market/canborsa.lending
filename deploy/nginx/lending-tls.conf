# Canton Lending with a domain and TLS (audit I-3, B-5, F-2). Template: setup.sh substitutes
# __SERVER_NAME__ (TLS_DOMAIN) and __CERT_DIR__ (/etc/letsencrypt/live/<domain>).
# The certificate is issued by certbot --webroot: :80 serves /.well-known/acme-challenge/ and
# redirects everything else to https. Renewal: certbot.timer; nginx reload: deploy-hook.
upstream lending_backend {
    include /etc/nginx/lending-upstream.conf;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://__SERVER_NAME__$request_uri;
    }
}

# Requests with a foreign Host (scanners by IP) do not reach the application
server {
    # `listen … http2`, not `http2 on`: nginx 1.18-1.24 from Ubuntu LTS does not know the new directive
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    # Mozilla intermediate profile: TLS 1.2+, no old ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:lending_tls:10m;
    ssl_session_tickets off;

    # One year, no includeSubDomains or preload: subdomains may not be on TLS. Extend deliberately.
    set $lending_proto https;
    set $lending_hsts "max-age=31536000";
    include /etc/nginx/lending-csp.conf;
    include /etc/nginx/lending-auth.conf;
    include /etc/nginx/lending-profile.conf;
    include /etc/nginx/snippets/lending-security-headers.conf;
    include /etc/nginx/snippets/lending-locations.conf;
}
