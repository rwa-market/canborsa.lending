# Cloudflare in SSL mode Flexible (setup.sh CLOUDFLARE=flexible): the visitor gets TLS from
# Cloudflare, and Cloudflare reaches the origin over plain HTTP on :80. The zone mode is shared with
# other domains, so the origin adapts. Appended to the site by setup.sh; __SERVER_NAME__ = TLS_DOMAIN.
# Only Cloudflare edges get the app here; a direct visitor is sent to https as before.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    if ($lending_via_cloudflare = 0) {
        return 301 https://__SERVER_NAME__$request_uri;
    }
    # Cloudflare sets X-Forwarded-Proto to the visitor scheme: plain http goes to https
    if ($http_x_forwarded_proto != "https") {
        return 301 https://__SERVER_NAME__$request_uri;
    }

    set $lending_proto https;
    set $lending_hsts "max-age=31536000";
    include /etc/nginx/lending-csp.conf;
    include /etc/nginx/lending-auth.conf;
    include /etc/nginx/lending-profile.conf;
    include /etc/nginx/snippets/lending-security-headers.conf;
    include /etc/nginx/snippets/lending-locations.conf;
}
