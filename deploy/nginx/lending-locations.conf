# Shared locations for the HTTP and TLS servers. Included inside server { }.
root /opt/lending/frontend/current;
index index.html;
limit_conn lending_conn 50;

# Client IP for the backend: overwrite, do not append (agreement §9, audit I-5).
# The backend trusts X-Forwarded-For only from TRUSTED_PROXIES addresses (127.0.0.1).
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
# $lending_proto: https in every server; the visitor scheme, not the hop to the origin
proxy_set_header X-Forwarded-Proto $lending_proto;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_hide_header X-Powered-By;

location = /healthz {
    auth_basic off;
    limit_req zone=lending_health burst=10 nodelay;
    proxy_pass http://lending_backend/health;
}

# Protocol readiness for the external monitor: price age, bots, accounts, indexer (backend
# /health/ready). The response has internal details, so it requires the monitor token (MONITOR_TOKEN):
# $lending_monitor_ok is set by the map from /etc/nginx/lending-monitor.conf (written by lending-ctl).
location = /healthz/ready {
    auth_basic off;
    limit_req zone=lending_health burst=10 nodelay;
    if ($lending_monitor_ok = 0) {
        return 401;
    }
    proxy_pass http://lending_backend/health/ready;
}

# Prometheus metrics and readiness are not exposed via /api/: host only
location ^~ /api/metrics {
    return 404;
}
location ^~ /api/health/ {
    return 404;
}

# Host state (disk, memory, backup freshness): JSON from lending-hostcheck.timer, no paths or secrets
location = /healthz/host {
    auth_basic off;
    limit_req zone=lending_health burst=10 nodelay;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/lending-security-headers.conf;
    alias /opt/lending/status/host-health.json;
}

location /api/auth/ {
    limit_req zone=lending_auth burst=10 nodelay;
    proxy_pass http://lending_backend/auth/;
    proxy_read_timeout 30s;
}

location /api/ {
    limit_req zone=lending_api burst=60 nodelay;
    proxy_pass http://lending_backend/;
    proxy_read_timeout 90s;
    proxy_next_upstream error timeout;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/lending-security-headers.conf;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/lending-security-headers.conf;
    try_files $uri /index.html;
}
