sdk-version: 3.5.12
name: lending-deploy
source: daml
version: 1.0.0
# Protocol deployment on real assets (TestNet, MainNet): Lending.Deploy.Prod:deployProd.
# Only core and governance, without lending-mocks and lending-tests (audit D-1). The DAR is not
# uploaded to the node: dpm script executes it (dependency daml-script).
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../vendor/splice-api-token-metadata-v1-1.0.0.dar
  - ../vendor/splice-api-token-holding-v1-1.0.0.dar
  - ../vendor/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - ../vendor/splice-api-featured-app-v1-1.0.0.dar
  - ../lending-core-v2/.daml/dist/lending-core-v2-1.0.3.dar
  - ../lending-governance-v2/.daml/dist/lending-governance-v2-1.0.4.dar
build-options:
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
